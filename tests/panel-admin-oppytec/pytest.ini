# =============================================================================
# Pytest Configuration - Panel Administrativo OppyTec v2.0 (Playwright E2E)
# =============================================================================

[pytest]
testpaths = tests/panel-admin-oppytec
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers --tb=short
markers =
    e2e: Pruebas end-to-end de navegabilidad real con Playwright
    auth: Flujos de autenticación e inicio de sesión seguro
    operators: Gestión de operadores y usuarios de plataforma
    holdings: Gestión de grupos holdings y cuotas comerciales
    legal_entities: Gestión de entidades legales y razones sociales
    plans: Gestión de planes comerciales y parametrización de cuotas
    tenants: Aprovisionamiento de tenants y asignación de módulos
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
