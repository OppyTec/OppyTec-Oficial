# ==============================================================================
# OppyTec v2.0 Frontend — Nginx SPA & API/WebSocket Reverse Proxy Configuration
# Garantiza enrutamiento HTML5 History API (SPA fallback a /index.html) para
# /login, /admin/login, /admin, /admin/users, etc., y proxy reverso hacia backend.
# ==============================================================================

server {
    listen 80;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de endurecimiento de seguridad (Security Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Proxy reverso para API REST v1 y WebSockets (/api/v1/ws/realtime)
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Evitar caché en el inyector de variables de entorno en runtime
    location = /runtime-env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Enrutamiento SPA (React 19): evita HTTP 404 al navegar directo a /login, /admin/login, /admin/*
    location / {
        try_files $uri $uri/ /index.html;
    }
}
